<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldWise</title>
    <meta
      name="description"
      content="WorldWise is a world map that tracks your footsteps into every city you visit. Never forget your travel experiences and share them with friends."
    />
    <!-- Hero image preload: starts the download before JS runs (LCP) -->
    <link rel="preload" as="image" href="/hero-960.webp" type="image/webp" fetchpriority="high" media="(max-width: 47.99rem)" />
    <link rel="preload" as="image" href="/hero-1920.webp" type="image/webp" fetchpriority="high" media="(min-width: 48rem)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
